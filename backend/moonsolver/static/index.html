<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonsolver</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #dcdcd8; --accent: #b8860b; --accent-text: #ffffff; --warn-bg: #fff4d6; --warn: #7a5600;
    --err-bg: #fde8e8; --err: #9b1c1c; --drop: #fbfaf5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214; --panel: #1c1c1f; --text: #ececee; --muted: #9a9aa2;
      --line: #333338; --accent: #ffcc33; --accent-text: #1a1a1a; --warn-bg: #3a2f10; --warn: #ffd97a;
      --err-bg: #3d1616; --err: #ffb3b3; --drop: #18181b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  #drop { border: 2px dashed var(--line); border-radius: 8px; background: var(--drop); padding: 22px 12px;
          text-align: center; cursor: pointer; color: var(--muted); }
  #drop.over { border-color: var(--accent); color: var(--text); }
  #drop strong { color: var(--text); display: block; margin-bottom: 4px; word-break: break-all; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 4px; }
  input[type=datetime-local], input[type=number], select {
    width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--text); font: inherit; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .check { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .check input { margin: 0; }
  button { font: inherit; border-radius: 6px; padding: 8px 12px; cursor: pointer; border: 1px solid var(--line);
           background: var(--panel); color: var(--text); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent);
                   width: 100%; margin-top: 18px; padding: 10px; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .small { font-size: 13px; padding: 5px 9px; margin-top: 6px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  #status { margin-top: 14px; font-size: 14px; min-height: 1.4em; }
  .msg { border-radius: 6px; padding: 8px 10px; margin-top: 12px; font-size: 14px; }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .msg.err { background: var(--err-bg); color: var(--err); }
  #stage { position: relative; min-height: 300px; display: flex; align-items: center; justify-content: center; }
  #stage .empty { color: var(--muted); }
  canvas { max-width: 100%; height: auto; display: block; border-radius: 6px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; font-size: 13px; }
  .toolbar[hidden] { display: none; }
  .toolbar .spacer { flex: 1; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; margin: 12px 0 0; }
  dt { color: var(--muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>Moonsolver</h1>
  <p class="sub">Foto hochladen, Zeit und Ort eintragen. Die App erkennt die Krater und beschriftet sie.</p>

  <div class="grid">
    <form class="panel" id="form">
      <div id="drop" tabindex="0">
        <strong id="dropTitle">Foto hierher ziehen</strong>
        <span id="dropSub">oder klicken zum Auswählen (JPG, PNG, TIFF)</span>
      </div>
      <input type="file" id="file" accept="image/*,.tif,.tiff" hidden>

      <label for="time">Aufnahmezeit</label>
      <input type="datetime-local" id="time" step="1" required>
      <select id="tz" aria-label="Zeitzone der Eingabe" style="margin-top:6px"></select>
      <div class="hint" id="utcPreview"></div>

      <label>Standort (Grad, Nord und Ost positiv)</label>
      <div class="row">
        <input type="number" id="lat" step="any" min="-90" max="90" placeholder="Breite" required>
        <input type="number" id="lon" step="any" min="-180" max="180" placeholder="Länge" required>
      </div>
      <button type="button" class="small" id="locate">Aktuellen Standort übernehmen</button>

      <button type="submit" class="primary" id="go" disabled>Krater erkennen</button>
      <div id="status"></div>
      <div id="msg"></div>
      <dl id="details" hidden></dl>
    </form>

    <section class="panel">
      <div class="toolbar" id="toolbar" hidden>
        <label class="check" style="margin:0"><input type="checkbox" id="showLabels" checked> Namen anzeigen</label>
        <label class="check" style="margin:0">Kleinste Krater
          <input type="range" id="minDia" min="4" max="80" value="12" style="width:110px">
          <span id="minDiaVal"></span>
        </label>
        <span class="spacer"></span>
        <button type="button" class="small" id="download" style="margin:0">Als PNG speichern</button>
      </div>
      <div id="stage"><span class="empty">Noch kein Foto geladen.</span></div>
    </section>
  </div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem("moonsolver." + k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem("moonsolver." + k, v); } catch { /* ohne Speicher weiter */ } },
  };

  let file = null, img = null, result = null, timer = null;
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  // --- Zeitzonen: lokale Browserzone oder UTC ---
  const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone || "lokal";
  $("tz").innerHTML = `<option value="local">Ortszeit (${localTz})</option><option value="utc">UTC</option>`;
  $("tz").value = store.get("tz") || "local";

  function timeUtc() {
    const v = $("time").value;
    if (!v) return null;
    const [d, t] = v.split("T");
    const [Y, M, D] = d.split("-").map(Number);
    const [h, m, s = 0] = t.split(":").map(Number);
    const date = $("tz").value === "utc" ? new Date(Date.UTC(Y, M - 1, D, h, m, s)) : new Date(Y, M - 1, D, h, m, s);
    return isNaN(date) ? null : date;
  }
  function showUtc() {
    const d = timeUtc();
    $("utcPreview").textContent = d ? "= " + d.toISOString().replace(".000Z", "Z").replace("T", " ") : "";
  }

  // --- gespeicherte Eingaben ---
  $("lat").value = store.get("lat") ?? "";
  $("lon").value = store.get("lon") ?? "";

  function ready() {
    $("go").disabled = !(file && timeUtc() && $("lat").value !== "" && $("lon").value !== "") || timer !== null;
  }
  ["time", "tz", "lat", "lon"].forEach((id) => $(id).addEventListener("input", () => { showUtc(); ready(); }));
  $("tz").addEventListener("change", () => { store.set("tz", $("tz").value); showUtc(); ready(); });

  $("locate").addEventListener("click", () => {
    if (!navigator.geolocation) return message("err", "Der Browser kann den Standort nicht ermitteln.");
    $("locate").disabled = true;
    navigator.geolocation.getCurrentPosition(
      (p) => { $("lat").value = p.coords.latitude.toFixed(4); $("lon").value = p.coords.longitude.toFixed(4);
               $("locate").disabled = false; ready(); },
      () => { $("locate").disabled = false; message("err", "Standort nicht verfügbar. Bitte von Hand eintragen."); },
      { timeout: 10000 });
  });

  // --- Datei: Drag-and-drop und Auswahl ---
  const drop = $("drop");
  drop.addEventListener("click", () => $("file").click());
  drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } });
  $("file").addEventListener("change", () => $("file").files[0] && setFile($("file").files[0]));
  ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, () => drop.classList.remove("over")));
  drop.addEventListener("drop", (e) => {
    e.preventDefault(); e.stopPropagation();
    const f = e.dataTransfer.files[0]; if (f) setFile(f);
  });
  // Fallen gelassene Dateien neben der Zone nicht im Tab öffnen
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) setFile(f); });

  function setFile(f) {
    file = f; result = null;
    $("dropTitle").textContent = f.name;
    $("dropSub").textContent = (f.size / 1e6).toFixed(1) + " MB · anderes Foto ziehen oder klicken";
    message(); $("details").hidden = true; $("toolbar").hidden = true; $("status").textContent = "";
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => { img = im; draw(); };
    im.onerror = () => {
      img = null;
      $("stage").innerHTML = '<span class="empty">Vorschau nicht möglich (z. B. TIFF). Das Erkennen funktioniert trotzdem.</span>';
    };
    im.src = url;
    if (f.lastModified && !$("time").value) {
      // Vorschlag aus dem Dateidatum, meist näher dran als nichts
      // in der gewaehlten Zeitzone darstellen, die Auswahl nicht aendern
      const d = new Date(f.lastModified);
      if ($("tz").value === "local") d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      $("time").value = d.toISOString().slice(0, 19);
      message("warn", "Aufnahmezeit aus dem Dateidatum vorgeschlagen. Bitte prüfen.");
      showUtc();
    }
    ready();
  }

  // --- Anfrage ---
  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const t = timeUtc();
    if (!file || !t) return;
    store.set("lat", $("lat").value); store.set("lon", $("lon").value);
    const fd = new FormData();
    fd.append("image", file);
    fd.append("time_utc", t.toISOString());
    fd.append("latitude_deg", $("lat").value);
    fd.append("longitude_deg", $("lon").value);
    fd.append("min_diameter_px", "4");  // filtern im Browser, damit der Regler ohne neue Rechnung wirkt

    message(); $("details").hidden = true; result = null; draw();
    const start = Date.now();
    const tick = () => { $("status").textContent = `Rechne … ${Math.round((Date.now() - start) / 1000)} s (meist 1–3 Minuten)`; };
    tick(); timer = setInterval(tick, 1000); ready();
    try {
      const r = await fetch("/solve", { method: "POST", body: fd });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(errorText(body) || `Fehler ${r.status}`);
      result = body;
      $("status").textContent = `Fertig nach ${Math.round((Date.now() - start) / 1000)} s.`;
      showDetails(body);
      if (!body.solution.reliable) {
        message("warn", "Unsichere Zuordnung: Das Foto passt nicht eindeutig zur berechneten Mondansicht. " +
                        "Die Namen können falsch sitzen. Zeit und Ort prüfen.");
      }
      $("toolbar").hidden = false;
      draw();
    } catch (err) {
      $("status").textContent = "";
      message("err", err.message === "Failed to fetch" ? "Backend nicht erreichbar." : err.message);
    } finally {
      clearInterval(timer); timer = null; ready();
    }
  });

  function errorText(body) {
    const d = body && body.detail;
    if (!d) return "";
    if (typeof d === "string") return d;
    return d.map((x) => x.msg).join("; ");
  }

  function message(kind, text) {
    $("msg").innerHTML = "";
    if (!kind) return;
    const div = document.createElement("div");
    div.className = "msg " + kind;
    div.textContent = text;
    $("msg").appendChild(div);
  }

  function showDetails(b) {
    const s = b.solution;
    const rows = [
      ["Score", s.score.toFixed(2) + (s.reliable ? " (sicher)" : " (unsicher)")],
      ["Drehung", s.rotation_deg.toFixed(1) + "°"],
      ["Gespiegelt", s.mirrored ? "ja" : "nein"],
      ["Mondradius", Math.round(s.moon_radius_px) + " px"],
      ["Libration", `${b.view.libration_lon_deg.toFixed(2)}° / ${b.view.libration_lat_deg.toFixed(2)}°`],
      ["Krater im Bild", String(b.labels.length)],
    ];
    $("details").innerHTML = "";
    for (const [k, v] of rows) {
      const dt = document.createElement("dt"); dt.textContent = k;
      const dd = document.createElement("dd"); dd.textContent = v;
      $("details").append(dt, dd);
    }
    $("details").hidden = false;
  }

  // --- Zeichnen ---
  const minDia = $("minDia");
  minDia.value = store.get("minDia") || 12;
  const showMin = () => { $("minDiaVal").textContent = minDia.value + " px"; };
  showMin();
  minDia.addEventListener("input", () => { showMin(); store.set("minDia", minDia.value); draw(); });
  $("showLabels").addEventListener("change", draw);
  let resizeTimer;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(draw, 200); });

  function draw() {
    if (!img) return;
    canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
    ctx.drawImage(img, 0, 0);
    if (result && $("showLabels").checked) drawLabels(result.labels);
    if (canvas.parentNode !== $("stage")) { $("stage").innerHTML = ""; $("stage").appendChild(canvas); }
  }

  function drawLabels(labels) {
    // Schrift auf dem Bildschirm etwa 13 px, egal wie stark das Foto verkleinert angezeigt wird
    const shown = $("stage").clientWidth || canvas.width;
    const size = Math.max(12, Math.round(13 * Math.max(1, canvas.width / shown)));
    const min = Math.max(Number(minDia.value), 0);
    ctx.font = `${size}px system-ui, Arial, sans-serif`;
    ctx.lineJoin = "round";
    const taken = [];
    // grosse Krater zuerst, kleine nur, wenn sie keinen Platz belegen
    for (const lb of [...labels].sort((a, b) => b.diameter_px - a.diameter_px)) {
      if (lb.diameter_px < min) continue;
      const w = ctx.measureText(lb.name).width;
      const box = [lb.x + 4, lb.y - size - 2, lb.x + 6 + w, lb.y + 2];
      if (taken.some((b) => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) continue;
      taken.push(box);
      const r = Math.max(3, size / 4);
      ctx.lineWidth = Math.max(2, size / 7);
      ctx.strokeStyle = "#ffcc33";
      ctx.beginPath(); ctx.arc(lb.x, lb.y, r, 0, 2 * Math.PI); ctx.stroke();
      ctx.lineWidth = Math.max(3, size / 5);
      ctx.strokeStyle = "#000";
      ctx.strokeText(lb.name, lb.x + 5, lb.y - 3);
      ctx.fillStyle = "#ffcc33";
      ctx.fillText(lb.name, lb.x + 5, lb.y - 3);
    }
  }

  $("download").addEventListener("click", () => {
    canvas.toBlob((blob) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (file ? file.name.replace(/\.[^.]+$/, "") : "mond") + "_labels.png";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, "image/png");
  });

  showUtc(); ready();
})();
</script>
</body>
</html>
