[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moonsolver"
version = "0.0.1"
description = "Krater auf Mondfotos erkennen und beschriften"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "skyfield>=1.48",
    "scipy>=1.11",
    "pillow>=10",
    "rasterio>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
data = ["rasterio>=1.3"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
